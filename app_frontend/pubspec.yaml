name: sanal_ogretmen
description: Rotix — AI destekli sanal öğretmen (ilkokul & ortaokul)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  web_socket_channel: ^3.0.1
  supabase_flutter: ^2.6.0
  flutter_tts: ^4.2.0
  just_audio: ^0.9.40
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/rotix_logo.jpg
    - assets/branding/roti_mascot.png
    - assets/data/curriculum_flat.json
